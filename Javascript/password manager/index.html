<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">

        <header>
            <div class="logo">
                <span>🔐</span>
                <div>
                    <h1>Password Manager</h1>
                    <p>Store your website credentials securely</p>
                </div>
            </div>

            <button class="add-btn" onclick="openForm()">
                + Add Password
            </button>
        </header>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search websites">
            <button onclick="searchPasswords()">🔍</button>
        </div>

        <div class="form-box" id="formBox">
            <h2 id="formTitle">Add New Password</h2>

            <input type="text" id="website" placeholder="Website Name">

            <input type="text" id="username" placeholder="Username / Email">

            <input type="password" id="password" placeholder="Password">

            <div class="form-buttons">
                <button onclick="savePassword()" id="saveBtn">
                    Save Password
                </button>

                <button class="cancel-btn" onclick="closeForm()">
                    Cancel
                </button>
            </div>
        </div>
           <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Website</th>
                        <th>Username / Email</th>
                        <th>Password</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="passwordList">
                </tbody>
            </table>
        </div>

        <p id="emptyMessage">No passwords saved!</p>

    </div>


     <!-- ----------------------------------------------- -->
    <script src="scriptt.js"></script>
</body>
</html>
