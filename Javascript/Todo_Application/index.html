<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>TODO Application</title>
</head>

<body>
    <header class="p-3">
        <div id="todo">
            <h1>My Todo List</h1>
        </div>
        <div id="todo">
            <p>Organize your day,One Task at a time</p>
        </div>
    </header>
    <main>
        <section class="container  border rounded
         shadow w-100 d-flex  m-auto mt-4 p-3 gap-3" >
                <input type="text" name="task" class="form-control " placeholder="Enter your Task...." id="input">
                <button class="btn btn-primary text-nowrap" onclick="addtask()">
                    Add Task
                </button>
        </section>
        <section class=" container border rounded col-12 m-auto mt-4 mb-4 bg-body-secondary d-flex p-5 w-100">
            <div  id="task">
               <h4>Total Task</h4> 
            </div>
            <div  id="task">
               <h4> Completed</h4>
            </div>
            <div  id="task">
               <h4> Pending</h4>
            </div>
        </section>
        <section class="container shadow w-100 d-flex m-auto mt-2 p-3 ">
                <ol class="w-100" id="tasklist">
                </ol>
        </section>
    </main>
    <!-- ---------------------------------------------------------------------------------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <script src="script.js"></script>
</body>

</html>
