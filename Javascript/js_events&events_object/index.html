<body>
        <button id="clickbtn" onclick="showalert()"> click btn</button>
       <button  onclick="showalert1()">click me</button>
       
      
       <div id="box1" class= " container border-4 bg-primary p-3 text-light fw-bold m-4 ">
        this is click btn
       </div>
        <div id="box2" class= " container border-4 bg-danger p-3 text-light fw-bold m-4 ">
        this is mousemove btn
       </div>
        <div id="box3" class= " container border-4 bg-info p-3 text-light fw-bold m-4">
        this is mousedown btn
       </div>
        <div id="box4" class= " container border-4 bg-dark p-3 text-light fw-bold m-4 ">
        this is  mouseenter btn
       </div>
        <div id="box5" class= " container border-4 bg-secondary p-3 text-light fw-bold m-4">
        this is mouseleave btn
       </div>
        <div id="box6" class= " container border-4 bg-success-subtle p-3 text-light fw-bold m-4 ">
        this is mouseout btn
       </div>
        <div id="box7" class= " container border-4 bg-warning p-3 text-light fw-bold m-4 ">
        this is  mouseover btn
       </div>
         <div id="box8" class= " container border-4 bg-primary p-3 text-light fw-bold m-4 ">
        this is mouseup btn
       </div>
         <div id="box9" class= " container border-4 bg-success p-3 text-light fw-bold  m-4 ">
        this is dblclick btn
       </div>
