<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tags</title>
</head>

<body>
    <fieldset>
        <legend align="center">basic form</legend>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" name="fullname" id="fullname" placeholder="enter your name" />

            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="enter your email" />

            <br>
            <br>
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" placeholder="enter your password">

            <br>
            <br>
            <label for="re-enterpassword">Re-enter Password:</label>
            <input type="password" name="re-enterpassword" id="re-enterpassword" placeholder="re-enterpassword">

            <br>
            <br>
            <label for="Dob">Date of Birth:</label>
            <input type="date" name="dob" id="Dob" placeholder="enter dob">

            <br>
            <br>
            <label for="Tob">Time of Birth:</label>
            <input type="time" name="tob" id="Tob" placeholder="enter tob">

            <br>
            <br>

            <label for="joiningtime">Time of joining:</label>
            <input type="datetime-local" name="joiningtime" id="joiningtime" placeholder="enter joiningtime">

            <br>
            <br>

            <label for="volume">volume:</label>
            <input type="range" name="volume" id="volume" min="0" max="10" value="2">

            <br>
            <br>

            <label for="mobile">Mobile number:</label>
            <input type="number" name="mobile" id="mobile" placeholder="mobile no.">

            <br>
            <br>

            <label for="age">Age:</label>
            <input type="number" name="age" id="age" placeholder="age">

            <br>
            <br>

            <label for="resume">resume:</label>
            <input type="file" name="resume" id="resume">

            <br>
            <br>

            <label for="address">address:</label>
            <textarea name=address" id="address"></textarea>

            <br>
            <br>

            <label for="course">course:</label>
            <select name="course" id="course">
                <option value=""> --Select course</option>
                <option value="btech">Btech</option>
                <option value="mtech">Mtech</option>
                <option value="bba">Bba</option>
                <option value="bca">Bca</option>
            </select>

            <br>
            <br>

            <label for="gender">gender:</label>
            <input type="radio" name="gender" id="male">
            <span>male</span>
            <input type="radio" name="gender" id="female">
            <span>female</span>
            <input type="radio" name="gender" id="other">
            <span>other</span>

            <br>
            <br>

            <label for="skills">skills:</label>
            <input type="checkbox" name="skills" id="java">
            <span>java</span>
             <input type="checkbox" name="skills" id="dsa">
            <span>dsa</span>
             <input type="checkbox" name="skills" id="python">
            <span>python</span>

            <br>
            <br>

            <img src="" alt="ss not found" width="800" height="400">
            <button>submit</button>
        </form>
    </fieldset>
</body>

</html>
