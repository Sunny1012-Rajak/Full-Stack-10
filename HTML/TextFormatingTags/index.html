<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting </title>
</head>

<body>
    <p>lorem ipsum dolor sit amet, <b>consectetur </b>adipiscing elit. Sed do <u>eiusmod</u> tempor incididunt ut labore et dolore
        magna aliqua. Ut enim ad minim veniam, quis nostrud <i>exercitation</i> ullamco laboris nisi ut aliquip ex ea commodo
        consequat.
    </p>
    <hr>
    <p> x <sub>2</sub> +  y <sup>2</sup> = z <sub>2</sub> </p>
</body>

</html>
